<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileMaker DDR Analyzer</title>
    <link rel="stylesheet" href="/styles/main.css">
    <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>FileMaker DDR Analyzer</h1>
            <p class="subtitle">Database Design Report Visualization Tool</p>
        </header>

        <main class="main-content">
            <!-- Upload view - shown initially -->
            <div id="upload-view" class="view-container">
                <ddr-upload></ddr-upload>
            </div>

            <!-- Analyzer view - shown after file upload -->
            <div id="analyzer-view" class="view-container" style="display: none;">
                <div class="analyzer-layout">
                    <!-- Sidebar with table list and variable list -->
                    <aside class="sidebar">
                        <div class="sidebar-tabs">
                            <button class="sidebar-tab active" id="tablesBtn">Tables</button>
                            <button class="sidebar-tab" id="variablesBtn">Variables</button>
                        </div>
                        <div class="sidebar-content">
                            <ddr-table-list id="tableListView" style="display: block;"></ddr-table-list>
                            <ddr-variable-list id="variableListView" style="display: none;"></ddr-variable-list>
                        </div>
                    </aside>

                    <!-- Main content area with graph -->
                    <section class="content-main">
                        <ddr-graph-view></ddr-graph-view>
                    </section>

                    <!-- Details panel -->
                    <aside class="details-panel">
                        <ddr-field-details></ddr-field-details>
                    </aside>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <p>FileMaker DDR Analyzer v1.0</p>
        </footer>
    </div>

    <!-- Load application -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
